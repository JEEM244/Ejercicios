<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación de lenguajes</title>
</head>
<body>
    <main>
        <h1>Lenguajes que quiero estudiar</h1>

        <table>
            <caption>Comparación personal de tecnologías de programación</caption>
            <thead>
                <tr>
                    <th scope="col">Lenguaje</th>
                    <th scope="col">Uso principal</th>
                    <th scope="col">Estado de estudio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">HTML</th>
                    <td>Estructura de páginas web</td>
                    <td>En práctica</td>
                </tr>
                <tr>
                    <th scope="row">CSS</th>
                    <td>Presentación de páginas web</td>
                    <td>Por reforzar</td>
                </tr>
                <tr>
                    <th scope="row">JavaScript</th>
                    <td>Interacción y lógica web</td>
                    <td>En aprendizaje</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
