<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-016 | Lista de tareas</title>
    <style>
        body { max-width: 680px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; line-height: 1.6; }
        form { display: flex; flex-wrap: wrap; gap: .5rem; }
        input { flex: 1; min-width: 12rem; padding: .7rem; }
        button { padding: .7rem 1rem; cursor: pointer; }
        li { margin-block: .5rem; }
    </style>
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Lista de tareas</h1>
        <form id="formulario">
            <label for="tarea">Nueva tarea</label>
            <input id="tarea" name="tarea" type="text" autocomplete="off">
            <button type="submit">Agregar</button>
        </form>
        <h2>Mis tareas</h2>
        <ul id="lista"></ul>
    </main>
</body>
</html>
