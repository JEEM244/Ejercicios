<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-018 | Validación</title>
    <style>
        body { max-width: 680px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; line-height: 1.6; }
        form { display: grid; gap: .8rem; }
        label { display: grid; gap: .25rem; }
        input, textarea, button { padding: .7rem; font: inherit; }
        textarea { min-height: 7rem; }
    </style>
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Formulario de práctica</h1>
        <p>Todos los datos se revisan localmente y no se envían a ningún servidor.</p>
        <form id="formulario" novalidate>
            <label for="nombre">Nombre (mínimo 3 caracteres)
                <input id="nombre" name="nombre" type="text" minlength="3" required>
            </label>
            <label for="correo">Correo electrónico
                <input id="correo" name="correo" type="email" required>
            </label>
            <label for="mensaje">Mensaje
                <textarea id="mensaje" name="mensaje" required></textarea>
            </label>
            <button type="submit">Revisar formulario</button>
        </form>
        <p id="estado" role="status" aria-live="polite">El formulario todavía no se ha revisado.</p>
    </main>
</body>
</html>
