<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-019 | Módulos y cálculos</title>
    <style>
        body { max-width: 680px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; line-height: 1.6; }
        form { display: grid; gap: .8rem; max-width: 22rem; }
        label { display: grid; gap: .25rem; }
        input, button { padding: .7rem; font: inherit; }
    </style>
    <script type="module" src="app.js"></script>
</head>
<body>
    <main>
        <h1>Calculadora con módulos</h1>
        <form id="formulario">
            <label for="numero-a">Primer número
                <input id="numero-a" type="number" step="any" required>
            </label>
            <label for="numero-b">Segundo número
                <input id="numero-b" type="number" step="any" required>
            </label>
            <button type="submit">Calcular</button>
        </form>
        <p id="resultado" aria-live="polite">Escribe dos números para comenzar.</p>
    </main>
</body>
</html>
